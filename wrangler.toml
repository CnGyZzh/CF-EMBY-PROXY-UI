name = "cf-emby-proxy-ui" # Worker 的项目名称
main = "worker.js" # Worker 的主入口文件
compatibility_date = "2026-03-13" # 兼容性日期，用于指定使用的 Cloudflare 运行时版本
compatibility_flags = ["enable_request_signal"] # 开启 Request.signal 客户端断开感知

[build]
command = "npm run build:worker"
watch_dir = ["worker", "vite.worker.config.js", "scripts/build-worker.mjs", "scripts/worker-build-lib.mjs"]

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# KV 命名空间绑定声明 (KV Namespace Binding)
[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "ENI_KV" # 代码中调用该 KV 的变量名
id = "9315f0a7b95047f192ecd2db6feae29f" # 已配置 KV 命名空间 ID

# D1 数据库绑定声明 (D1 Database Binding)
[[d1_databases]]
binding = "DB" # 代码中调用该数据库的变量名
database_name = "emby_proxy_logs" # D1 数据库名称（需与 Cloudflare 控制台实际名称一致）
database_id = "00085cba-1900-43aa-81ab-2297b6b7ffc9" # 已配置 D1 数据库 ID
